name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (CPU-only PyTorch on Linux)
        run: uv sync --locked --extra cpu
      - name: Lint
        run: |
          set -o pipefail
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Test (synthetic fixtures only; real provider data never enters CI)
        run: |
          set -o pipefail
          uv run --locked pytest -m "not real"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
